<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Dream Core</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ocean.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">DREAM CORE</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="page-head">
        <h1>สั่งซื้อ</h1>
        <hr class="divider">
        <p class="lead">กรอกรายละเอียดด้านล่าง ทีมงานจะติดต่อกลับเพื่อยืนยันการชำระเงินและจัดส่ง</p>
      </div>

      <form id="orderForm" class="form-panel glass" novalidate>
        <div class="field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" required>
        </div>
        <div class="field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="number" id="total" name="total" min="0" inputmode="numeric" required>
        </div>
        <div class="field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่ง หรือข้อความถึงเรา (ถ้ามี)"></textarea>
        </div>
        <button type="submit" class="btn">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">DREAM CORE</span>
      <p>© Dream Core</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
